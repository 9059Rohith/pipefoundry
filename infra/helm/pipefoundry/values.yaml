image:
  repository: pipefoundry
  tag: "0.1.0"
  pullPolicy: IfNotPresent
apiTokenSecret: pipefoundry-api
connectorSecret: pipefoundry-connectors
storage:
  size: 2Gi
  storageClass: ""
  accessMode: ReadWriteOnce
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 1000m, memory: 512Mi}
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  # Add only approved public connector CIDRs; never 0.0.0.0/0.
  connectorCidrs: []
