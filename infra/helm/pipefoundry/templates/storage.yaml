apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipefoundry-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.storage.accessMode }}]
  {{- if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.storage.size }}}
