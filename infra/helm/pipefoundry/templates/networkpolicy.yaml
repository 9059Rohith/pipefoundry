{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: pipefoundry-api}
spec:
  podSelector:
    matchLabels: {app: pipefoundry-api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app: pipefoundry-postgres}
      ports: [{port: 5432, protocol: TCP}]
    {{- range .Values.networkPolicy.connectorCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{port: 443, protocol: TCP}]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: pipefoundry-workers}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: pipefoundry-worker}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app: pipefoundry-postgres}
      ports: [{port: 5432, protocol: TCP}]
    {{- range .Values.networkPolicy.connectorCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{port: 443, protocol: TCP}]
    {{- end }}
{{- end }}
