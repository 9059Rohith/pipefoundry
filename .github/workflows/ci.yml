name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pipefoundry
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: pipefoundry
        ports: ['55435:5432']
        options: >-
          --health-cmd 'pg_isready -U pipefoundry -d pipefoundry'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PIPEFOUNDRY_POSTGRES_DSN: postgresql://pipefoundry:ci-local-only@127.0.0.1:55435/pipefoundry
      PIPEFOUNDRY_TEST_SPARK: '1'
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: python -m pip install -r requirements-dev.lock -r requirements-spark.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m bandit -r src -f json -o evidence/ci-bandit.json
      - run: python -m pip_audit -r requirements.lock -f json -o evidence/ci-pip-audit.json
      - run: python -m pip_audit --no-deps --disable-pip -r requirements-spark.lock -f json -o evidence/ci-spark-audit.json
      - run: python -m pytest -q --junitxml=evidence/ci-tests.xml
      - run: python scripts/benchmark.py --samples 30 --execution-samples 10 --output evidence/ci-benchmark.json
      - run: python -m build --wheel --no-isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: python-evidence, path: evidence/ci-*}
  deployment-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.13.5'}
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - run: helm lint infra/helm/pipefoundry
      - run: helm template pipefoundry infra/helm/pipefoundry > evidence/ci-helm.yaml
      - run: docker run --rm -v "$PWD/evidence:/manifests:ro" ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary /manifests/ci-helm.yaml
      - run: docker build -t pipefoundry:ci .
      - run: docker image save -o evidence/ci-image.tar pipefoundry:ci
      - run: >-
          docker run --rm -v "$PWD/evidence:/evidence"
          aquasec/trivy:0.76.1 image --input /evidence/ci-image.tar
          --scanners vuln --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL
          --format json --output /evidence/ci-image-scan.json
      - run: rm evidence/ci-image.tar
      - run: docker run --rm --read-only --tmpfs /tmp pipefoundry:ci python -c 'from pipefoundry.worker import run; from pipefoundry.models import Pipeline; import tempfile; from pathlib import Path; c=Pipeline.model_validate({"name":"ci","schedule":"0 * * * *"}); r=run(c,Path(tempfile.mkdtemp())); assert r["total_rows"]==3; print(r)'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: deployment-evidence, path: evidence/ci-*}
